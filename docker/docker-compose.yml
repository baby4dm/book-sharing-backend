services:
  postgres:
    image: postgres:16-alpine
    container_name: bookshare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookshare-db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - bookshare_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshare_user -d bookshare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookshare_pg_data: